<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafLife 2D - AircraftGames Edition</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #111214 0%, #1a2a6c 50%, #275d38 100%);
            color: #f2f3f5;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            pointer-events: auto !important; /* Forțează Discord să trimită click-urile */
        }
        .game-window {
            background: rgba(43, 45, 49, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 320px;
            text-align: center;
            border: 2px solid #2ecc71;
            position: relative;
            pointer-events: auto !important;
            user-select: none;
            z-index: 1;
        }
        h1 { margin: 0 0 5px 0; color: #2ecc71; font-size: 26px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .currency-display {
            background: #111214; padding: 8px 15px; border-radius: 20px;
            display: inline-block; font-weight: bold; color: #f1c40f; margin-bottom: 15px;
        }
        .stage-box { font-size: 14px; color: #e3e5e8; margin-bottom: 10px; font-weight: bold; text-shadow: 1px 1px 2px black; min-height: 38px; }
        
        .tree-stage-wrapper {
            height: 180px; display: flex; align-items: center; justify-content: center; margin: 15px 0;
            position: relative; overflow: hidden;
        }
        .tree-emoji {
            font-size: 90px;
            filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }

        @keyframes moveBeluga {
            0% { transform: translateX(-40px) scaleX(1); }
            50% { transform: translateX(40px) scaleX(1); }
            51% { transform: translateX(40px) scaleX(-1); }
            100% { transform: translateX(-40px) scaleX(-1); }
        }
        .beluga-active {
            animation: moveBeluga 3s infinite alternate ease-in-out;
        }

        .bar-container { text-align: left; font-size: 12px; color: #b5bac1; margin-top: 10px; font-weight: bold; }
        .bar { background: #4e5058; border-radius: 10px; height: 14px; width: 100%; margin-top: 4px; overflow: hidden; position: relative; }
        .bar-fill { height: 100%; width: 30%; background: linear-gradient(90deg, #3498db, #00bfff); transition: width 0.3s ease-in-out; }
        #expFill { width: 0%; background: linear-gradient(90deg, #2ecc71, #a3e4d7); }

        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn {
            background: #248046; color: white; border: none; padding: 12px;
            font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s, transform 0.1s;
            display: block; width: 100%; box-sizing: border-box;
            pointer-events: auto !important;
        }
        .btn:hover { background: #1a6535; transform: scale(1.02); }
        .btn-shop { background: #e67e22; }
        .btn-shop:hover { background: #d35400; }
        .btn-music { background: #4f545c; margin-top: 15px; width: 100%; }
        .btn-music:hover { background: #686d73; }

        .end-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 18, 20, 0.95); border-radius: 18px;
            flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        .end-screen h2 { color: #e74c3c; margin-bottom: 5px; font-size: 28px; }
        .end-screen p { color: #b5bac1; margin-bottom: 20px; padding: 0 20px; }

        .shop-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(43, 45, 49, 0.98); border-radius: 18px;
            flex-direction: column; padding: 20px; box-sizing: border-box; z-index: 9;
        }
        .shop-item {
            background: #1e1f22; padding: 12px; border-radius: 10px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #4e5058;
        }
        .close-shop { background: #ed4245; margin-top: auto; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://soundhelix.com" type="audio/mpeg">
    </audio>

    <div class="game-window">
        <div id="endScreen" class="end-screen">
            <h2>LeafLifeGame Ended</h2>
            <p>You have successfully ascended the cosmic tree to its final stage!</p>
            <button id="btnContinue" class="btn" style="background:#3498db; width:80%;">Continue Grind 🚀</button>
        </div>

        <div id="shopModal" class="shop-modal">
            <h2 style="color:#e67e22; margin-top:0;">Space Shop UI</h2>
            <div class="shop-item">
                <div style="text-align: left;">
                    🐱 <b>Beluga Pet</b><br>
                    <small style="color:#949ba4;">Spawns moving Beluga</small>
                </div>
                <button id="btnBuyBeluga" class="btn" style="background:#f1c40f; color:#000; width: auto;">70 🪙</button>
            </div>
            <div class="shop-item">
                <div style="text-align: left;">
                    ❓ <b>??? Secret Item</b><br>
                    <small style="color:#949ba4;">Unlock ultimate truth</small>
                </div>
                <button id="btnBuySecret" class="btn" style="background:#9b59b6; width: auto;">100 🪙</button>
            </div>
            <button id="btnCloseShop" class="btn close-shop">Back to Tree</button>
        </div>

        <h1>🍂 LeafLife 2D</h1>
        <div class="currency-display">🪙 <span id="coinCount">0</span> Aircraft Coins</div>
        
        <div class="stage-box" id="stageTitle">🌱 Stage 1: Mystic Space Seed</div>
        
        <div class="tree-stage-wrapper">
            <div id="treeAsset" class="tree-emoji">🌱</div>
        </div>

        <div class="bar-container">
            💧 Hydration Level:
            <div class="bar"><div id="waterFill" class="bar-fill"></div></div>
        </div>
        
        <div class="bar-container">
            ✨ Evolution Progress:
            <div class="bar"><div id="expFill" class="bar-fill"></div></div>
        </div>

        <div class="actions-grid">
            <button id="btnWater" class="btn">💧 Water Tree</button>
            <button id="btnOpenShop" class="btn btn-shop">🛒 Open Shop UI</button>
        </div>

        <button id="musicBtn" class="btn btn-music">🎵 Play Background Music</button>
    </div>

    <script>
        window.addEventListener("DOMContentLoaded", function() {
            var coins = 0;
            var water = 30;
            var exp = 0;
            var stage = 1;
            var musicPlaying = false;
            var hasBeluga = false;

            var gameStages = {
                1: { name: "🌱 Stage 1: Mystic Space Seed", emoji: "🌱" },
                2: { name: "🌿 Stage 2: Sprouting Leaf", emoji: "🌿" },
                3: { name: "🌳 Stage 3: Aircraft Bonsai", emoji: "🌳" },
                4: { name: "✨ Stage 4: Ascended Ancient Entity", emoji: "✨" }
            };

            function render() {
                document.getElementById("coinCount").innerText = coins;
                document.getElementById("waterFill").style.width = water + "%";
                document.getElementById("expFill").style.width = exp + "%";
                
                var treeAsset = document.getElementById("treeAsset");
                
                if (hasBeluga) {
                    treeAsset.innerHTML = '<img src="https://imgur.com" alt="Beluga" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover;">';
                    treeAsset.className = "tree-emoji beluga-active";
                    document.getElementById("stageTitle").innerText = "🐱 Beluga is vibing on your screen!";
                } else {
                    treeAsset.innerHTML = gameStages[stage].emoji;
                    treeAsset.className = "tree-emoji";
                    document.getElementById("stageTitle").innerText = gameStages[stage].name;
                }
            }

            function waterAction() {
                water += 15;
                if (water > 100) water = 100;

                coins += Math.floor(Math.random() * 4) + 3;
                exp += 25;

                if (exp >= 100) {
                    if (stage < 4) {
                        stage++;
                        exp = 0;
                        water = 30;
                        triggerEvolutionEffect();
                        
                        if (stage === 4) {
                            document.getElementById("endScreen").style.display = "flex";
                        }
                    } else {
                        exp = 100;
                    }
                }
                render();
            }

            function continueGrind() {
                document.getElementById("endScreen").style.display = "none";
            }

            function toggleShop(show) {
                document.getElementById("shopModal").style.display = show ? "flex" : "none";
            }

            function buyBeluga() {
                if (coins >= 70) {
                    coins -= 70;
                    hasBeluga = true;
                    toggleShop(false);
                    render();
                } else {
