<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafLife 2D - AircraftGames</title>
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.0.0/dist/index.global.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1c1e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            text-align: center;
            background: #2b2d31;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 320px;
        }
        h1 { font-size: 24px; margin-bottom: 5px; color: #2ecc71; }
        .stage-text { font-size: 14px; color: #b5bac1; margin-bottom: 20px; }
        .plant-canvas {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            transition: transform 0.3s ease;
        }
        .plant-canvas:hover { transform: scale(1.05); }
        .stat-bar {
            background-color: #4e5058;
            border-radius: 8px;
            height: 16px;
            width: 100%;
            margin: 15px 0;
            overflow: hidden;
        }
        .stat-fill {
            background: linear-gradient(90deg, #3498db, #2ecc71);
            height: 100%;
            width: 20%;
            transition: width 0.4s ease;
        }
        .btn {
            background-color: #248046;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .btn:hover { background-color: #1a6535; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🍂 LeafLife</h1>
        <div class="stage-text" id="stageName">Stage: Loading Cosmic Seed...</div>
        
        <img id="plantImg" src="https://i.imgur.com/83p1XbK.png" class="plant-canvas" alt="Plant Stature">
        
        <div style="font-size: 14px; text-align: left; color: #b5bac1;">Hydration Level:</div>
        <div class="stat-bar">
            <div id="waterFill" class="stat-fill"></div>
        </div>

        <button class="btn" onclick="waterPlant()">💧 Care & Water Plant</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
